name: Build Plugin Package

on:
  push:
    branches: [main, development]
    tags: ['v*']
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package panna-wild-tour
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Lint PHP files
        run: |
          if find . -name '*.php' -print0 | xargs -0 -r php -l | grep -v 'No syntax errors'; then
            echo "::error::PHP syntax errors detected"
            exit 1
          fi

      - name: Validate plugin structure
        run: |
          test -f panna-wild-tour.php
          grep -qiE 'Plugin Name:' panna-wild-tour.php

      - name: Build installable zip
        shell: bash
        run: |
          set -euo pipefail
          SLUG="panna-wild-tour"
          VERSION="$(grep -iE 'Version:' panna-wild-tour.php | head -n1 | sed -E 's/.*Version:[[:space:]]*([0-9][^[:space:];]*).*/\1/')"
          VERSION="${VERSION:-dev}"
          PKG_ROOT="${RUNNER_TEMP}/pkg"
          mkdir -p "${PKG_ROOT}/${SLUG}"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            --exclude='*.zip' \
            --exclude='*.bak' \
            --exclude='*.log' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='build/' \
            --exclude='vendor/' \
            ./ "${PKG_ROOT}/${SLUG}/"
          ZIP_PATH="${RUNNER_TEMP}/${SLUG}-${VERSION}.zip"
          ( cd "${PKG_ROOT}" && zip -qr "${ZIP_PATH}" "${SLUG}" )
          echo "ZIP_PATH=${ZIP_PATH}" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Verify zip structure
        run: |
          unzip -l "${ZIP_PATH}" | grep -q "${SLUG}/panna-wild-tour.php"
          unzip -l "${ZIP_PATH}" | grep -q "${SLUG}/uninstall.php"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: panna-wild-tour-${{ env.PACKAGE_VERSION }}
          path: ${{ runner.temp }}/pkg
          if-no-files-found: error

      - name: Download artifact as delivered
        uses: actions/download-artifact@v4
        with:
          name: panna-wild-tour-${{ env.PACKAGE_VERSION }}
          path: ${{ runner.temp }}/verify

      - name: Verify downloaded artifact is installable
        run: |
          set -euo pipefail
          ZIP="$(find "${{ runner.temp }}/verify" -type f -name '*.zip' | head -n1)"
          test -n "${ZIP}"
          TOP="$(unzip -l "${ZIP}" | awk '{print $4}' | grep -E '^[^[:space:]]+/' | cut -d/ -f1 | sort -u)"
          test "$(printf '%s\n' "${TOP}" | wc -l)" -eq 1
          unzip -l "${ZIP}" | grep -q "${TOP}/panna-wild-tour.php"
          unzip -l "${ZIP}" | grep -q "${TOP}/uninstall.php"

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "${ZIP_PATH}" \
            --title "panna-wild-tour ${GITHUB_REF_NAME}" \
            --generate-notes || true
